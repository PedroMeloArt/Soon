<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            background: url('resources/Green.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .glass-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 80px 80px;
            text-align: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 60px;
            line-height: 1.6;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-form {
            display: flex;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto 40px;
        }

        .email-input {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .email-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .submit-btn {
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .launch-date {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .social-links {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .glass-container {
                padding: 60px 40px;
                margin: 20px;
            }
            
            h1 {
                font-size: 3rem;
            }
            
            .email-form {
                flex-direction: column;
                gap: 16px;
            }
            
            .submit-btn {
                padding: 16px 24px;
            }
        }

        @media (max-width: 480px) {
            .glass-container {
                padding: 40px 24px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1>Coming Soon</h1>
        <p class="subtitle">
            Something beautiful is growing. We're crafting an experience that will inspire and delight.
        </p>
        
        <form class="email-form" onsubmit="handleSubmit(event)">
            <input 
                type="email" 
                class="email-input" 
                placeholder="your@email.com"
                required
            >
            <button type="submit" class="submit-btn">Notify Me</button>
        </form>
        
        <p class="launch-date">Expected Launch: Spring 2026</p>
        
        <div class="social-links">
            <a href="#" class="social-link">✉</a>
            <a href="#" class="social-link">𝕏</a>
            <a href="#" class="social-link">in</a>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const button = event.target.querySelector('.submit-btn');
            const input = event.target.querySelector('.email-input');
            const originalText = button.textContent;
            
            button.textContent = 'Thank you ✓';
            button.style.background = 'rgba(34, 197, 94, 0.3)';
            
            setTimeout(() => {
                button.textContent = originalText;
                button.style.background = 'rgba(255, 255, 255, 0.2)';
                input.value = '';
            }, 2500);
        }

        // Subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.glass-container');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            
            container.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
